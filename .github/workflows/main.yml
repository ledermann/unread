name: Test

on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  lint:
    name: RuboCop
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - run: bundle exec rubocop

  test:
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }} / ${{ matrix.db }}
    runs-on: ubuntu-26.04
    continue-on-error: ${{ matrix.rails == 'edge' }}

    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4', '4.0']
        rails: ['8.1']
        db: [sqlite, mysql, trilogy, postgres]
        include:
          - ruby: '4.0'
            rails: edge
            db: sqlite

    env:
      RAILS_VERSION: ${{ matrix.rails }}
      DB: ${{ matrix.db }}

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: unread_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: unread_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - run: bundle exec rspec
